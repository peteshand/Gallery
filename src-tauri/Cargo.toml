[package]
name = "gallery"
version = "0.10.1"
description = "Personal photo gallery"
authors = ["Gallery"]
edition = "2021"

[lib]
name = "gallery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-gallery-media = { path = "../plugins" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
chrono = "0.4"
log = "0.4"
aws-sdk-s3 = { version = "=1.149.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "rustls"] }
aws-smithy-async = "=1.3.0"
aws-smithy-http-client = { version = "=1.4.2", features = ["rustls-aws-lc"] }
tokio = { version = "1.53.1", features = ["time"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[target.'cfg(any(target_os = "macos", target_os = "android"))'.dependencies]
keyring-core = "=1.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"
jni = "0.21"
